    attribution_ceiling: causal_verified

  - id: trigger_warping
    title: "Warping-based triggers (WaNet family)"
    clause: "2.2.2"
    disposition: declared_unsupported
    reason: "Reversal parameterisation does not cover warping fields at T1."
    attribution_ceiling: unattributable

  - id: trigger_input_aware
    title: "Input-aware / dynamic triggers"
    clause: "2.2.2"
    disposition: declared_unsupported
    reason: "Per-class minimal-perturbation solve assumes a static trigger."
    attribution_ceiling: unattributable

  - id: reversal_detection_head
    title: "Per-class reversal on detection heads"
    clause: "2.2.2"
    disposition: declared_unsupported
    reason: >
      Reversal is specified for classification logits. Replaced by the amplitude-sweep
      appearance/disappearance rate.
    attribution_ceiling: unattributable

  - id: architectural_backdoor
    title: "Architectural or weight-only backdoor (no poisoned data)"
    clause: "2.2.2"
    disposition: assessed
    mechanisms: [C3a.ladder, C3d.activation_stats]
    attribution_ceiling: unattributable
    note: >
      Detection partially possible; attribution undefined (no_data_locus). The data partition
      carries no information about a change made in the architecture or the weights.

  - id: undetectable_by_construction
    title: "Backdoor planted to be undetectable by any efficient black-box test"
    clause: "2.2.2"
    disposition: declared_unsupported
    reason: >
      Out of scope BY THEOREM, not by engineering gap. Goldwasser, Kim, Vaikuntanathan and
      Zamir (arXiv:2204.06974) construct backdoors no efficient black-box behavioural test
      detects. Detection is the precondition for attribution.
    attribution_ceiling: unattributable
    adversary: A10
    permanent: true

